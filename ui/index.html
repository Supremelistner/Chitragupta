<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>चित्रगुप्त</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-light" data-lang="hi">

    <!-- Profile setup modal: shown on first launch when no profile exists -->
    <div class="modal" id="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title" hidden>
        <div class="modal-card">
            <div class="modal-greeting" id="profile-modal-greeting">नमस्ते</div>
            <h1 class="modal-title" id="profile-modal-title" data-i18n="profile_setup_prompt">मुझे आपका नाम बताइए</h1>
            <p class="modal-helper" id="profile-modal-helper">मैं आपको {name} जी कहकर बुलाऊँगा।</p>
            <form class="profile-form" id="profile-form">
                <label for="profile-name-input" class="visually-hidden" data-i18n="settings_name_label">Your name</label>
                <input type="text" id="profile-name-input" class="profile-name-input"
                       autocomplete="given-name" required>
                <button type="submit" class="btn btn-primary btn-large" data-i18n="profile_setup_continue">
                    शुरू करें
                </button>
            </form>
        </div>
    </div>

    <!-- Settings drawer (closed by default) -->
    <div class="drawer" id="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="settings-drawer-title" hidden>
        <div class="drawer-card">
            <div class="drawer-header">
                <h2 class="drawer-title" id="settings-drawer-title" data-i18n="settings_profile">प्रोफ़ाइल</h2>
                <button class="btn-icon" id="settings-close" aria-label="Close">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <form class="settings-form" id="settings-form">
                <label class="field-label" data-i18n="settings_name_label" for="settings-name-input">आपका नाम</label>
                <input type="text" id="settings-name-input" class="profile-name-input"
                       autocomplete="given-name">
                <div class="field-label" data-i18n="nav_dark_mode">गहरा रंग</div>
                <label class="toggle">
                    <input type="checkbox" id="theme-toggle">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </label>
                <div class="settings-actions">
                    <button type="button" class="btn btn-secondary" id="settings-cancel" data-i18n="settings_close">बंद करें</button>
                    <button type="submit" class="btn btn-primary" data-i18n="settings_save">सहेजें</button>
                </div>
            </form>
        </div>
    </div>

    <div class="app">

        <!-- Sidebar: hidden on small screens, off-canvas -->
        <aside class="sidebar" id="sidebar" aria-label="Conversations">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-mark" aria-hidden="true">चि</div>
                    <div>
                        <div class="brand-name" id="brand-name">चित्रगुप्त</div>
                        <div class="brand-tagline" id="brand-tagline" data-i18n="app_tagline">आपका निजी दस्तावेज़ सहायक</div>
                    </div>
                </div>
                <button class="btn-icon" id="btn-new-chat" aria-label="नई बातचीत" data-i18n-aria="nav_new_chat">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </div>
            <div class="session-list" id="session-list" role="list">
                <!-- populated by JS -->
            </div>
            <div class="sidebar-footer">
                <button class="btn-icon sidebar-btn" id="btn-open-settings" aria-label="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </aside>

        <!-- Main chat area -->
        <main class="chat-main">
            <header class="chat-header">
                <button class="btn-icon btn-sidebar-toggle" id="btn-sidebar-toggle" aria-label="Toggle conversations">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <div class="chat-title-wrap">
                    <h1 class="chat-title" id="chat-title" data-i18n="nav_new_chat">नई बातचीत</h1>
                </div>
                <div class="header-actions">
                    <div class="lang-switch" role="group" aria-label="Language">
                        <button class="lang-chip active" data-lang-code="hi" id="lang-hi" aria-label="Hindi">हिं</button>
                        <button class="lang-chip" data-lang-code="en" id="lang-en" aria-label="English">EN</button>
                    </div>
                </div>
            </header>

            <div class="messages" id="messages" role="log" aria-live="polite">
                <!-- Welcome screen (replaced by message list when chat starts) -->
                <div class="welcome" id="welcome">
                    <div class="welcome-greeting" id="welcome-greeting">नमस्ते</div>
                    <p class="welcome-subtitle" id="welcome-subtitle">मैं आपके कागज़ात सँभालता हूँ। नीचे कुछ सामान्य काम दिए हैं — या अपना सवाल नीचे लिखें।</p>
                    <div class="life-events">
                        <button class="life-card" data-quick="I want to add an ID card photo. Please tell me what to do.">
                            <div class="life-icon" aria-hidden="true">🪪</div>
                            <div class="life-title" data-i18n="welcome_card_id_title">ID कार्ड की फोटो</div>
                            <div class="life-sub" data-i18n="welcome_card_id_sub">आधार, पैन, पासपोर्ट</div>
                        </button>
                        <button class="life-card" data-quick="I am going to a hospital. What documents should I bring?">
                            <div class="life-icon" aria-hidden="true">🏥</div>
                            <div class="life-title" data-i18n="welcome_card_hospital_title">अस्पताल के लिए</div>
                            <div class="life-sub" data-i18n="welcome_card_hospital_sub">क्या क्या कागज़ चाहिए</div>
                        </button>
                        <button class="life-card" data-quick="I need to open a bank account or do KYC. What documents do I need?">
                            <div class="life-icon" aria-hidden="true">🏦</div>
                            <div class="life-title" data-i18n="welcome_card_bank_title">बैंक / KYC</div>
                            <div class="life-sub" data-i18n="welcome_card_bank_sub">खाता खोलना, KYC</div>
                        </button>
                        <button class="life-card" data-quick="What government schemes am I eligible for? Check my documents.">
                            <div class="life-icon" aria-hidden="true">📋</div>
                            <div class="life-title" data-i18n="welcome_card_scheme_title">सरकारी योजना</div>
                            <div class="life-sub" data-i18n="welcome_card_scheme_sub">पेंशन, राशन, आयुष्मान</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Confirmation pill (shown when a sensitive tool wants approval) -->
            <div class="confirm-pill" id="confirm-pill" hidden>
                <div class="confirm-text">
                    <span id="confirm-message">Action requires approval</span>
                </div>
                <input type="text" id="confirm-correction" class="confirm-correction"
                       autocomplete="off">
                <div class="confirm-actions">
                    <button class="btn btn-secondary" id="btn-deny">नहीं, रद्द करो</button>
                    <button class="btn btn-primary" id="btn-approve">हाँ, दिखाओ</button>
                </div>
            </div>

            <!-- Upload preview chips (hidden until a file is selected) -->
            <div class="upload-strip" id="upload-strip" hidden>
                <div class="upload-strip-content" id="upload-strip-content"></div>
                <button class="btn-icon" id="btn-upload-remove" aria-label="Remove files">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Input area: bottom-anchored, large tap targets -->
            <div class="composer">
                <div class="composer-inner">
                    <button class="btn-icon composer-attach" id="btn-attach" aria-label="Attach photo">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <textarea id="message-input" rows="1" aria-label="Type your question"></textarea>
                    <button class="btn-icon composer-send" id="btn-send" aria-label="Send" disabled>
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
            </div>
        </main>

    </div>

    <script>
        // Cross-service config injected by the orchestrator. Tells the
        // audio helper which origin hosts the model service.
        window.CHITRAGUPTA_CONFIG = window.CHITRAGUPTA_CONFIG || {};
    </script>
    <script src="/static/i18n.js"></script>
    <script src="/static/audio.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
