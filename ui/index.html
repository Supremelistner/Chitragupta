<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chitragupta</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">Chitragupta</h1>
                <button class="btn-new-chat" id="btn-new-chat" title="New conversation">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </div>
            <div class="session-list" id="session-list">
                <!-- Sessions populated by JS -->
            </div>
        </aside>

        <!-- Main chat area -->
        <main class="chat-main">
            <header class="chat-header">
                <button class="btn-sidebar-toggle" id="btn-sidebar-toggle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <div class="chat-header-info">
                    <h2 id="chat-title">New conversation</h2>
                    <span class="session-status" id="session-status"></span>
                </div>
                <button class="btn-language-toggle" id="btn-language-toggle" title="Switch language">
                    <span class="language-label" id="language-label">EN</span>
                </button>
                <button class="btn-delete-chat" id="btn-delete-chat" title="Delete conversation">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                </button>
            </header>

            <div class="messages" id="messages">
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    </div>
                    <h2>How can I help with your documents?</h2>
                    <p>I can help you search, organize, and understand your documents.</p>
                    <div class="suggestions">
                        <button class="suggestion" data-message="What documents do I have?">What documents do I have?</button>
                        <button class="suggestion" data-message="Help me find my Aadhaar card">Find my Aadhaar card</button>
                        <button class="suggestion" data-message="What do I need for LIC insurance?">LIC insurance requirements</button>
                        <button class="suggestion" data-message="Check if my documents are valid">Validate my documents</button>
                    </div>
                </div>
            </div>

            <!-- Confirmation dialog (hidden by default) -->
            <div class="confirmation-bar" id="confirmation-bar" style="display:none">
                <div class="confirmation-content">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
                    <span id="confirmation-message">Action requires approval</span>
                </div>
                <input type="text" id="confirmation-correction" class="confirmation-correction-input" placeholder="wrong field? type the correct name before denying" autocomplete="off" />
                <div class="confirmation-actions">
                    <button class="btn-confirm btn-deny" id="btn-deny">Deny</button>
                    <button class="btn-confirm btn-approve" id="btn-approve">Approve</button>
                </div>
            </div>

            <!-- Upload preview (hidden by default) -->
            <div class="upload-preview" id="upload-preview" style="display:none">
                <div class="upload-preview-content" id="upload-preview-content">
                    <!-- Files populated dynamically -->
                </div>
                <div class="upload-preview-footer">
                    <span id="upload-preview-count"></span>
                    <button class="btn-upload-remove" id="btn-upload-remove" title="Remove all files">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>

            <!-- Input area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <input type="file" id="file-input" accept="image/*,.pdf" multiple style="display:none" />
                    <button class="btn-attach" id="btn-attach" title="Attach file">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <textarea id="message-input" placeholder="Ask about your documents..." rows="1"></textarea>
                    <button class="btn-send" id="btn-send" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
                <div class="input-footer">
                    <span>Chitragupta &middot; Document Companion</span>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
