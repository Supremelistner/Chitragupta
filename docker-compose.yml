# Chitragupta — Infrastructure Services
# Run: docker compose up -d
# Stop: docker compose down
# Data persists in named volumes across restarts.

services:
  postgres:
    image: postgres:16-alpine
    # Self-heal after Docker Desktop restarts / OOM kills (exit 255 wiped
    # the stack mid-run before and every test went mass-skip).
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chitragupta
      POSTGRES_USER: chitragupta
      POSTGRES_PASSWORD: chitragupta_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chitragupta -d chitragupta"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image does not ship curl or wget. Use bash's built-in
      # /dev/tcp to do a cheap TCP-only check on the listening port.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 || exit 1'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  qdrant_data:
